<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Насти</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 400px;
            animation: fadeIn 2s ease;
        }
        h1 { color: #ff9a9e; font-size: 2.2em; margin-bottom: 10px; }
        p { font-size: 1.2em; line-height: 1.6; color: #e0e0e0; }
        .year { font-size: 1.5em; color: #ff9a9e; margin-top: 20px; font-weight: bold; }
        .heart { font-size: 3em; animation: beat 1.5s infinite; display: inline-block; margin-top: 10px;}
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
    </style>
</head>
<body>
    <div class="card">
        <h1>Привет, Настя!</h1>
        <p>Этот небольшой сайт для тебя, Настя. Я тебя люблю ❤️</p>
        <p class="year">2024</p>
        <div class="heart">💖</div>
    </div>
</body>
</html>
